<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="700" height="220" fill="#fbfbfb"/>
  <text x="350" y="26" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">컴파일 오류는 실행 전에, 런타임 오류는 실행 중에 걸린다</text>

  <rect x="50" y="56" width="260" height="120" rx="10" fill="#dff5e6" stroke="#188a5e" stroke-width="2"/>
  <text x="180" y="82" font-size="13" font-weight="bold" fill="#15513c" text-anchor="middle">컴파일 오류</text>
  <text x="180" y="106" font-size="11.5" text-anchor="middle" fill="#2d3748">코드 작성 중, 실행도</text>
  <text x="180" y="122" font-size="11.5" text-anchor="middle" fill="#2d3748">하기 전에 바로 잡힌다</text>
  <text x="180" y="146" font-size="11" text-anchor="middle" fill="#15513c">예: 없는 변수 참조, 타입 불일치</text>

  <rect x="390" y="56" width="260" height="120" rx="10" fill="#fff5f5" stroke="#dd6b20" stroke-width="2"/>
  <text x="520" y="82" font-size="13" font-weight="bold" fill="#7b341e" text-anchor="middle">런타임 오류</text>
  <text x="520" y="106" font-size="11.5" text-anchor="middle" fill="#2d3748">실행은 되지만, 특정 코드에</text>
  <text x="520" y="122" font-size="11.5" text-anchor="middle" fill="#2d3748">도달해야만 터진다</text>
  <text x="520" y="146" font-size="11" text-anchor="middle" fill="#7b341e">예: NullPointerException</text>

  <text x="350" y="205" font-size="11.5" fill="#2d3748" text-anchor="middle">컴파일 때 잡히는 게 훨씬 반가운 이유 — 실행해보지 않고도 미리 알 수 있으니까</text>
</svg>
