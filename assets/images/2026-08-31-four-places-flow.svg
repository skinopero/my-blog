<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="300" fill="#fbfbfb"/>

  <!-- 1. 작업대 -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <rect x="55" y="45" width="50" height="35" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
    <line x1="20" y1="95" x2="140" y2="95" stroke="#a0aec0" stroke-width="4"/>
    <text x="80" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">작업대</text>
    <text x="80" y="163" text-anchor="middle" font-size="11" fill="#718096">Working Dir</text>
  </g>

  <!-- 2. 상자 -->
  <g transform="translate(260,60)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <polygon points="45,55 115,55 125,95 35,95" fill="#fbd38d" stroke="#c05621" stroke-width="2"/>
    <rect x="35" y="95" width="90" height="30" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
    <text x="80" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">상자</text>
    <text x="80" y="163" text-anchor="middle" font-size="11" fill="#718096">Staging Area</text>
  </g>

  <!-- 3. 내 창고 -->
  <g transform="translate(490,60)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <rect x="35" y="55" width="90" height="20" fill="#edf2f7" stroke="#2d3748" stroke-width="1.5"/>
    <rect x="35" y="35" width="90" height="20" fill="#e2e8f0" stroke="#2d3748" stroke-width="1.5"/>
    <line x1="90" y1="10" x2="90" y2="35" stroke="#2b6cb0" stroke-width="3"/>
    <polygon points="90,10 90,25 120,17" fill="#2b6cb0"/>
    <text x="80" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">내 창고</text>
    <text x="80" y="163" text-anchor="middle" font-size="11" fill="#718096">Local Repository</text>
  </g>

  <!-- 4. 마을 광장 -->
  <g transform="translate(710,60)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <circle cx="80" cy="90" r="10" fill="#a0aec0"/>
    <circle cx="55" cy="95" r="8" fill="#cbd5e0"/>
    <circle cx="105" cy="95" r="8" fill="#cbd5e0"/>
    <line x1="80" y1="30" x2="80" y2="80" stroke="#dd6b20" stroke-width="3"/>
    <polygon points="80,30 80,48 115,39" fill="#dd6b20"/>
    <text x="80" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">마을 광장</text>
    <text x="80" y="163" text-anchor="middle" font-size="11" fill="#718096">GitHub (Remote)</text>
  </g>

  <!-- arrows -->
  <g font-size="12" font-weight="bold">
    <path d="M195 100 L255 100" stroke="#38a169" stroke-width="3" fill="none"/>
    <polygon points="255,94 268,100 255,106" fill="#38a169"/>
    <text x="225" y="88" text-anchor="middle" fill="#38a169">add</text>

    <path d="M425 100 L485 100" stroke="#2b6cb0" stroke-width="3" fill="none"/>
    <polygon points="485,94 498,100 485,106" fill="#2b6cb0"/>
    <text x="455" y="88" text-anchor="middle" fill="#2b6cb0">commit</text>

    <path d="M655 92 L705 92" stroke="#dd6b20" stroke-width="3" fill="none"/>
    <polygon points="705,86 718,92 705,98" fill="#dd6b20"/>
    <text x="680" y="80" text-anchor="middle" fill="#dd6b20">push</text>

    <path d="M705 118 L655 118" stroke="#805ad5" stroke-width="3" fill="none"/>
    <polygon points="655,112 642,118 655,124" fill="#805ad5"/>
    <text x="680" y="140" text-anchor="middle" fill="#805ad5">pull</text>
  </g>
</svg>
