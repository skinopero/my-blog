<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="700" height="300" fill="#fbfbfb"/>

  <!-- empty land -->
  <g transform="translate(60,90)">
    <rect x="0" y="120" width="200" height="10" fill="#cbd5e0"/>
    <text x="100" y="160" text-anchor="middle" font-size="13" fill="#a0aec0">빈 땅</text>
    <text x="100" y="60" text-anchor="middle" font-size="12" fill="#cbd5e0">(아직 창고 없음)</text>
  </g>

  <g transform="translate(300,150)">
    <path d="M0 0 L120 0" stroke="#38a169" stroke-width="5" fill="none"/>
    <polygon points="120,-14 158,0 120,14" fill="#38a169"/>
    <text x="79" y="-24" text-anchor="middle" font-size="14" font-family="monospace" fill="#38a169">git init</text>
  </g>

  <!-- warehouse built -->
  <g transform="translate(500,70)">
    <rect x="0" y="120" width="160" height="10" fill="#cbd5e0"/>
    <polygon points="10,60 80,15 150,60" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
    <rect x="20" y="60" width="120" height="60" fill="#fbd38d" stroke="#c05621" stroke-width="2"/>
    <rect x="65" y="85" width="30" height="35" fill="#c05621"/>
    <text x="80" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">내 창고 생김</text>
    <text x="80" y="168" text-anchor="middle" font-size="11" fill="#718096">이제부터 변화를 지켜봄</text>
  </g>
</svg>
