<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="300" fill="#fbfbfb"/>

  <!-- LEFT: List -->
  <text x="200" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">List — 번호표 들고 줄서기</text>
  <g transform="translate(80,70)">
    <rect x="0"   y="0" width="60" height="50" rx="6" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <rect x="68"  y="0" width="60" height="50" rx="6" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <rect x="136" y="0" width="60" height="50" rx="6" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <rect x="204" y="0" width="60" height="50" rx="6" fill="#fff5e6" stroke="#dd6b20" stroke-width="2.5"/>
    <text x="30"  y="32" text-anchor="middle" font-size="13" fill="#2d3748">a</text>
    <text x="98"  y="32" text-anchor="middle" font-size="13" fill="#2d3748">b</text>
    <text x="166" y="32" text-anchor="middle" font-size="13" fill="#2d3748">a</text>
    <text x="234" y="32" text-anchor="middle" font-size="13" fill="#dd6b20">d</text>
    <text x="0"   y="70" font-size="11" fill="#718096">0</text>
    <text x="68"  y="70" font-size="11" fill="#718096">1</text>
    <text x="136" y="70" font-size="11" fill="#718096">2</text>
    <text x="204" y="70" font-size="11" fill="#718096">3</text>
  </g>
  <text x="200" y="175" text-anchor="middle" font-size="12.5" fill="#4a5568">순서가 있고(index), 중복(a)도 허용</text>

  <!-- RIGHT: Set -->
  <text x="620" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">Set — 중복 없는 바구니</text>
  <ellipse cx="620" cy="140" rx="150" ry="80" fill="#e6f3ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="570" y="110" font-size="14" fill="#2c5282">java</text>
  <text x="660" y="95"  font-size="14" fill="#2c5282">db</text>
  <text x="600" y="160" font-size="14" fill="#2c5282">spring</text>
  <text x="670" y="150" font-size="14" fill="#2c5282">jpa</text>
  <text x="620" y="265" text-anchor="middle" font-size="12.5" fill="#4a5568">순서 없이 뒤섞여 있고, 중복은 한 번만 남는다</text>
</svg>
