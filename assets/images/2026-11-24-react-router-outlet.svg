<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="310" fill="#fbfbfb"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">안내판(Navbar)은 그대로, 방(Outlet)만 바뀌어요</text>

  <!-- layout frame -->
  <rect x="30" y="50" width="420" height="220" rx="14" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="240" y="72" text-anchor="middle" font-size="12" fill="#5B6884">&lt;Layout /&gt;</text>
  <rect x="44" y="84" width="120" height="172" rx="10" fill="#2b6cb0" opacity="0.15" stroke="#2b6cb0" stroke-width="2"/>
  <text x="104" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">&lt;Navbar /&gt;</text>
  <text x="104" y="136" text-anchor="middle" font-size="11" fill="#2d3748">React 챕터</text>
  <text x="104" y="158" text-anchor="middle" font-size="11" fill="#2d3748">프로젝트 생성</text>
  <text x="104" y="180" text-anchor="middle" font-size="11" fill="#2d3748">모듈</text>
  <text x="104" y="232" text-anchor="middle" font-size="10" fill="#5B6884">항상 그대로</text>
  <rect x="176" y="84" width="262" height="172" rx="10" fill="#dd6b20" opacity="0.12" stroke="#dd6b20" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="307" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#dd6b20">&lt;Outlet /&gt;</text>
  <text x="307" y="150" text-anchor="middle" font-size="12" fill="#2d3748">주소에 맞는 컴포넌트가</text>
  <text x="307" y="170" text-anchor="middle" font-size="12" fill="#2d3748">여기에만 들어와요</text>

  <!-- mapping -->
  <text x="500" y="84" font-size="13" font-weight="bold" fill="#2d3748">주소 → 들어오는 컴포넌트</text>
  <rect x="500" y="98" width="270" height="40" rx="8" fill="#fbfbfb" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="515" y="123" font-size="12" fill="#2d3748">/  (index)</text>
  <text x="640" y="123" font-size="12" fill="#2d3748">→  &lt;Main /&gt;</text>
  <rect x="500" y="146" width="270" height="40" rx="8" fill="#fbfbfb" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="515" y="171" font-size="12" fill="#2d3748">/vite/intro</text>
  <text x="640" y="171" font-size="12" fill="#2d3748">→  &lt;Hello /&gt;</text>
  <rect x="500" y="194" width="270" height="40" rx="8" fill="#fbfbfb" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="515" y="219" font-size="12" fill="#2d3748">/vite/module</text>
  <text x="640" y="219" font-size="12" fill="#2d3748">→  &lt;UserInfo /&gt;</text>

  <text x="400" y="296" text-anchor="middle" font-size="12" fill="#5B6884">NavLink를 누르면 페이지를 새로 불러오지 않고 주소와 Outlet 안만 바뀌어요.</text>
</svg>
