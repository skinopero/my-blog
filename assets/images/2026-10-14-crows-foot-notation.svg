<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="640" height="240" fill="#fbfbfb"/>

  <!-- boxes -->
  <rect x="60" y="90" width="160" height="60" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="140" y="125" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d3748">카테고리</text>

  <rect x="420" y="90" width="160" height="60" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="500" y="125" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d3748">메뉴</text>

  <!-- connecting line -->
  <line x1="220" y1="120" x2="420" y2="120" stroke="#2d3748" stroke-width="2"/>

  <!-- "one and only one" bars near category end: two short perpendicular ticks -->
  <line x1="244" y1="108" x2="244" y2="132" stroke="#2b6cb0" stroke-width="2.5"/>
  <line x1="256" y1="108" x2="256" y2="132" stroke="#2b6cb0" stroke-width="2.5"/>

  <!-- crow's foot (many) + circle (zero) near menu end -->
  <circle cx="356" cy="120" r="9" fill="#fbfbfb" stroke="#dd6b20" stroke-width="2.5"/>
  <path d="M380,120 L410,108 M380,120 L410,120 M380,120 L410,132" fill="none" stroke="#dd6b20" stroke-width="2.5"/>

  <!-- labels -->
  <text x="250" y="90" font-size="13" font-weight="bold" fill="#2b6cb0" text-anchor="middle">1..1</text>
  <text x="250" y="160" font-size="11.5" fill="#2b6cb0" text-anchor="middle">필수(1개)</text>

  <text x="383" y="90" font-size="13" font-weight="bold" fill="#dd6b20" text-anchor="middle">0..N</text>
  <text x="383" y="160" font-size="11.5" fill="#dd6b20" text-anchor="middle">선택(0개~여러 개)</text>

  <text x="320" y="200" font-size="12.5" fill="#2d3748" text-anchor="middle">메뉴는 반드시 카테고리 1개에 속하고(1..1), 카테고리는 메뉴가 0개여도 된다(0..N)</text>
</svg>
