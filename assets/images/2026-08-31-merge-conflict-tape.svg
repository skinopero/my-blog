<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#fbfbfb"/>

  <text x="350" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">충돌난 블록에 붙는 표시 테이프</text>

  <g transform="translate(150,60)">
    <rect x="0" y="0" width="400" height="300" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>

    <!-- tape 1 -->
    <rect x="0" y="0" width="400" height="34" fill="#fbb6ce" opacity="0.5"/>
    <text x="12" y="23" font-size="14" font-family="monospace" fill="#97266d">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>

    <!-- main content (red) -->
    <rect x="0" y="34" width="400" height="106" fill="#fed7d7"/>
    <text x="200" y="80" text-anchor="middle" font-size="14" fill="#742a2a">main 블록에 칠한 색</text>
    <text x="200" y="102" text-anchor="middle" font-size="12" fill="#742a2a">(지금 내가 서 있는 브랜치)</text>

    <!-- divider tape -->
    <rect x="0" y="140" width="400" height="34" fill="#e2e8f0"/>
    <text x="12" y="163" font-size="14" font-family="monospace" fill="#4a5568">=======</text>

    <!-- test content (blue) -->
    <rect x="0" y="174" width="400" height="106" fill="#bee3f8"/>
    <text x="200" y="220" text-anchor="middle" font-size="14" fill="#2a4365">test 블록에 칠한 색</text>
    <text x="200" y="242" text-anchor="middle" font-size="12" fill="#2a4365">(합치려던 브랜치)</text>

    <!-- tape 3 -->
    <rect x="0" y="280" width="400" height="20" fill="#fbb6ce" opacity="0.5"/>
    <text x="12" y="295" font-size="13" font-family="monospace" fill="#97266d">&gt;&gt;&gt;&gt;&gt;&gt;&gt; test</text>
  </g>

  <text x="350" y="386" text-anchor="middle" font-size="12" fill="#a0aec0">테이프(기호)를 지우고 남길 색을 정하면 충돌 해결 끝</text>
</svg>
