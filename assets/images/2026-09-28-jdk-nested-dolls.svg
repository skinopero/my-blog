<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="360" fill="#fbfbfb"/>

  <text x="410" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">JDK는 러시아 인형처럼 생겼다</text>

  <rect x="80" y="70" width="660" height="250" rx="16" fill="#edf2f7" stroke="#2d3748" stroke-width="3"/>
  <text x="105" y="100" font-size="15" font-weight="bold" fill="#2d3748">JDK</text>
  <text x="105" y="120" font-size="12" fill="#4a5568">javac · java · jshell · jar ...</text>

  <rect x="150" y="135" width="520" height="150" rx="14" fill="#fff5e6" stroke="#dd6b20" stroke-width="3"/>
  <text x="175" y="162" font-size="15" font-weight="bold" fill="#dd6b20">JRE</text>
  <text x="175" y="182" font-size="12" fill="#975a16">java.lang · java.util · java.io ...</text>

  <rect x="230" y="195" width="360" height="65" rx="12" fill="#e6f3ff" stroke="#2b6cb0" stroke-width="3"/>
  <text x="410" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">JVM</text>
  <text x="410" y="242" text-anchor="middle" font-size="12" fill="#2c5282">클래스 로더 · 검증기 · 실행 엔진</text>

  <text x="410" y="340" text-anchor="middle" font-size="12" fill="#a0aec0">JDK 하나만 설치하면 그 안에 JRE와 JVM이 전부 들어있다</text>
</svg>
