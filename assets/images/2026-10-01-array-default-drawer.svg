<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="260" fill="#fbfbfb"/>
  <text x="410" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">int[] iarr = new int[5]; — 아직 아무것도 안 넣었는데</text>

  <g transform="translate(100,80)">
    <rect x="0"   y="0" width="120" height="80" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <rect x="140" y="0" width="120" height="80" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <rect x="280" y="0" width="120" height="80" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <rect x="420" y="0" width="120" height="80" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <rect x="560" y="0" width="120" height="80" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>

    <text x="60"  y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6cb0">0</text>
    <text x="200" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6cb0">0</text>
    <text x="340" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6cb0">0</text>
    <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6cb0">0</text>
    <text x="620" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6cb0">0</text>

    <text x="60"  y="105" text-anchor="middle" font-size="12" fill="#718096">iarr[0]</text>
    <text x="200" y="105" text-anchor="middle" font-size="12" fill="#718096">iarr[1]</text>
    <text x="340" y="105" text-anchor="middle" font-size="12" fill="#718096">iarr[2]</text>
    <text x="480" y="105" text-anchor="middle" font-size="12" fill="#718096">iarr[3]</text>
    <text x="620" y="105" text-anchor="middle" font-size="12" fill="#718096">iarr[4]</text>
  </g>

  <text x="410" y="230" text-anchor="middle" font-size="12" fill="#a0aec0">heap은 빈 칸을 허용하지 않아서, JVM이 미리 기본값(int는 0)을 채워둔다</text>
</svg>
