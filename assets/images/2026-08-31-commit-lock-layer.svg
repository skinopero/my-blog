<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="700" height="340" fill="#fbfbfb"/>

  <!-- staging box with block -->
  <g transform="translate(60,60)">
    <text x="85" y="-15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">상자 (Staging)</text>
    <polygon points="30,60 140,60 155,110 15,110" fill="#fbd38d" stroke="#c05621" stroke-width="2"/>
    <rect x="15" y="110" width="140" height="40" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
    <rect x="55" y="45" width="60" height="30" fill="#68d391" stroke="#2f855a" stroke-width="2"/>
  </g>

  <path d="M240 175 L360 175" stroke="#2b6cb0" stroke-width="5" fill="none"/>
  <polygon points="360,161 398,175 360,189" fill="#2b6cb0"/>
  <text x="300" y="155" text-anchor="middle" font-size="13" font-family="monospace" fill="#2b6cb0">git commit</text>

  <!-- tower with new layer locking in -->
  <g transform="translate(430,60)">
    <text x="90" y="-15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">내 창고 (탑)</text>
    <rect x="30" y="160" width="120" height="50" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <text x="90" y="190" text-anchor="middle" font-size="12" fill="#2d3748">블록 1</text>
    <rect x="30" y="105" width="120" height="50" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <text x="90" y="135" text-anchor="middle" font-size="12" fill="#2d3748">블록 2</text>
    <rect x="30" y="50" width="120" height="50" fill="#c6f6d5" stroke="#2f855a" stroke-width="3"/>
    <text x="90" y="80" text-anchor="middle" font-size="12" fill="#276749">블록 3 (새로 고정!)</text>
  </g>

  <text x="350" y="290" text-anchor="middle" font-size="12" fill="#a0aec0">상자 속 블록이 탑의 새 층으로 단단히 고정된다</text>
</svg>
