<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="260" fill="#fbfbfb"/>

  <text x="24" y="28" font-size="14" font-weight="bold" fill="#2d3748">TIMESTAMP는 2038년에서 끊기고, DATETIME은 9999년까지 간다</text>

  <!-- DATETIME row -->
  <text x="24" y="80" font-size="12.5" font-weight="bold" fill="#2b6cb0">DATETIME</text>
  <line x1="130" y1="76" x2="700" y2="76" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/>
  <text x="130" y="60" font-size="11" fill="#718096">1000</text>
  <text x="700" y="60" font-size="11" fill="#718096" text-anchor="end">9999</text>
  <circle cx="470" cy="76" r="6" fill="#2b6cb0"/>
  <text x="470" y="100" font-size="11.5" fill="#2b6cb0" text-anchor="middle">2040 구독 만료일 ✓ 저장 가능</text>

  <!-- TIMESTAMP row -->
  <text x="24" y="160" font-size="12.5" font-weight="bold" fill="#dd6b20">TIMESTAMP</text>
  <line x1="130" y1="156" x2="330" y2="156" stroke="#dd6b20" stroke-width="6" stroke-linecap="round"/>
  <line x1="330" y1="156" x2="700" y2="156" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 10"/>
  <text x="130" y="140" font-size="11" fill="#718096">1970</text>
  <text x="330" y="140" font-size="11" fill="#dd6b20" text-anchor="middle" font-weight="bold">2038-01-19</text>

  <circle cx="470" cy="156" r="6" fill="#dd6b20"/>
  <text x="470" y="140" font-size="11" fill="#c53030">✕</text>
  <text x="470" y="180" font-size="11.5" fill="#dd6b20" text-anchor="middle">2040 구독 만료일 ✕ 저장 불가 (범위 밖)</text>

  <line x1="330" y1="40" x2="330" y2="170" stroke="#dd6b20" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="380" y="230" font-size="12" fill="#2d3748" text-anchor="middle">TIMESTAMP는 1970~2038년의 초를 32비트 정수로 저장하기 때문에 생기는 한계다</text>
</svg>
