<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="700" height="260" fill="#fbfbfb"/>
  <text x="350" y="26" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">같은 페이지 안에서 #id로 점프하기</text>

  <rect x="260" y="46" width="180" height="40" rx="8" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="350" y="70" font-size="12" text-anchor="middle" fill="#2d3748">&lt;a href="#index2"&gt;목차2&lt;/a&gt;</text>

  <path d="M350 86 V200" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aj)"/>

  <rect x="60" y="110" width="180" height="40" rx="8" fill="#fff" stroke="#718096" stroke-width="1.25"/>
  <text x="150" y="134" font-size="11.5" text-anchor="middle" fill="#718096">&lt;h4 id="index1"&gt;</text>

  <rect x="260" y="200" width="180" height="40" rx="8" fill="#dff5e6" stroke="#188a5e" stroke-width="2"/>
  <text x="350" y="224" font-size="12" font-weight="bold" text-anchor="middle" fill="#15513c">&lt;h4 id="index2"&gt; ← 여기로 이동!</text>

  <rect x="460" y="110" width="180" height="40" rx="8" fill="#fff" stroke="#718096" stroke-width="1.25"/>
  <text x="550" y="134" font-size="11.5" text-anchor="middle" fill="#718096">&lt;h4 id="index3"&gt;</text>

  <text x="350" y="256" font-size="11.5" fill="#2d3748" text-anchor="middle">href="#id값"은 새 페이지가 아니라, 같은 id를 가진 태그 위치로 화면만 이동시킨다</text>

  <defs><marker id="aj" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2b6cb0"/></marker></defs>
</svg>
