  <text x="450" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">#474747 — 4개 중 1개 화면에만 있음 → 예외</text>
  <text x="450" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f855a">#a0a0a0 — 4개 중 3개 화면에 있음 → 시스템</text>
