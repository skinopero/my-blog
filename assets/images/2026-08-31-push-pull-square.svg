<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="700" height="320" fill="#fbfbfb"/>

  <!-- warehouse -->
  <g transform="translate(70,80)">
    <text x="80" y="-20" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">내 창고</text>
    <polygon points="10,50 80,10 150,50" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
    <rect x="20" y="50" width="120" height="60" fill="#fbd38d" stroke="#c05621" stroke-width="2"/>
  </g>

  <!-- town square -->
  <g transform="translate(470,80)">
    <text x="80" y="-20" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">마을 광장 (GitHub)</text>
    <circle cx="40" cy="90" r="12" fill="#cbd5e0"/>
    <circle cx="120" cy="90" r="12" fill="#cbd5e0"/>
    <circle cx="80" cy="98" r="14" fill="#a0aec0"/>
    <line x1="80" y1="20" x2="80" y2="70" stroke="#dd6b20" stroke-width="3"/>
    <polygon points="80,20 80,38 115,29" fill="#dd6b20"/>
  </g>

  <!-- push arrow (top) -->
  <path d="M240 140 L440 140" stroke="#dd6b20" stroke-width="5" fill="none"/>
  <polygon points="440,126 478,140 440,154" fill="#dd6b20"/>
  <text x="340" y="125" text-anchor="middle" font-size="14" font-family="monospace" fill="#dd6b20">git push</text>
  <text x="340" y="165" text-anchor="middle" font-size="11" fill="#7b341e">내 창고 → 광장 (보내기)</text>

  <!-- pull arrow (bottom, reverse) -->
  <path d="M440 220 L240 220" stroke="#805ad5" stroke-width="5" fill="none"/>
  <polygon points="240,206 202,220 240,234" fill="#805ad5"/>
  <text x="340" y="205" text-anchor="middle" font-size="14" font-family="monospace" fill="#805ad5">git pull</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#44337a">광장 → 내 창고 (받아오기)</text>
</svg>
