<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="740" height="260" fill="#fbfbfb"/>
  <text x="370" y="24" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">두 번의 UPDATE 중 하나라도 실패하면, 전부 되돌린다</text>

  <rect x="30" y="50" width="330" height="150" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="195" y="74" font-size="12.5" font-weight="bold" fill="#742a2a" text-anchor="middle">비정상 흐름</text>
  <text x="50" y="98" font-size="11" fill="#2d3748">① 홍길동 계좌 -3000원 (성공)</text>
  <text x="50" y="118" font-size="11" fill="#2d3748">② 없는 계좌(99)에 +3000원 (실패!)</text>
  <text x="195" y="150" font-size="12" font-weight="bold" fill="#742a2a" text-anchor="middle">ROLLBACK</text>
  <text x="195" y="172" font-size="11" fill="#742a2a" text-anchor="middle">① 작업도 함께 취소됨</text>
  <text x="195" y="188" font-size="10.5" fill="#9b2c2c" text-anchor="middle">→ 돈이 허공에 사라지지 않는다</text>

  <rect x="380" y="50" width="330" height="150" rx="10" fill="#dff5e6" stroke="#188a5e" stroke-width="2"/>
  <text x="545" y="74" font-size="12.5" font-weight="bold" fill="#15513c" text-anchor="middle">정상 흐름</text>
  <text x="400" y="98" font-size="11" fill="#2d3748">① 홍길동 계좌 -3000원 (성공)</text>
  <text x="400" y="118" font-size="11" fill="#2d3748">② 김짱구 계좌 +3000원 (성공)</text>
  <text x="545" y="150" font-size="12" font-weight="bold" fill="#15513c" text-anchor="middle">COMMIT</text>
  <text x="545" y="172" font-size="11" fill="#15513c" text-anchor="middle">① ② 모두 영구 반영</text>

  <text x="370" y="230" font-size="11" fill="#2d3748" text-anchor="middle">계좌이체는 논리적으로 하나의 작업이지만, 실제로는 UPDATE 2번 — 그래서 트랜잭션이 필요하다</text>
</svg>
