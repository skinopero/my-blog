<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="380" fill="#fbfbfb"/>

  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">학습용 클론 — 그대로 두는 것과 바꾸는 것</text>

  <!-- original card -->
  <text x="230" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">원본</text>
  <rect x="140" y="75" width="180" height="240" rx="12" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
  <rect x="155" y="90" width="150" height="100" rx="8" fill="#f6ad55"/>
  <circle cx="180" cy="115" r="12" fill="#ffffff" opacity="0.7"/>
  <polygon points="165,175 195,140 225,165 260,130 285,175" fill="#ffffff" opacity="0.5"/>
  <text x="230" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">브랜드 상점</text>
  <text x="230" y="234" text-anchor="middle" font-size="13" fill="#4a5568">29,900원</text>
  <text x="230" y="254" text-anchor="middle" font-size="12" fill="#718096">서울 강남</text>
  <rect x="165" y="272" width="130" height="28" rx="14" fill="#f6ad55"/>
  <text x="230" y="291" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">담기</text>

  <!-- arrow -->
  <line x1="335" y1="195" x2="465" y2="195" stroke="#2d3748" stroke-width="3"/>
  <polygon points="465,187 483,195 465,203" fill="#2d3748"/>
  <text x="400" y="178" text-anchor="middle" font-size="12" fill="#4a5568">클론</text>

  <!-- clone card -->
  <text x="590" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">클론(학습용)</text>
  <rect x="500" y="75" width="180" height="240" rx="12" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
  <rect x="515" y="90" width="150" height="100" rx="8" fill="#e2e8f0" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="565" y="120" width="50" height="38" rx="4" fill="none" stroke="#a0aec0" stroke-width="2"/>
  <circle cx="577" cy="132" r="5" fill="#a0aec0"/>
  <polygon points="565,155 580,138 595,150 605,132 615,155" fill="none" stroke="#a0aec0" stroke-width="2"/>
  <text x="590" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">OO 상점</text>
  <text x="590" y="234" text-anchor="middle" font-size="13" fill="#4a5568">0,000원</text>
  <text x="590" y="254" text-anchor="middle" font-size="12" fill="#718096">지역명</text>
  <rect x="525" y="272" width="130" height="28" rx="14" fill="#f6ad55"/>
  <text x="590" y="291" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">담기</text>

  <!-- legend -->
  <rect x="200" y="335" width="16" height="16" fill="#f6ad55"/>
  <text x="224" y="348" font-size="13" fill="#2d3748">그대로: 색·크기·간격·배치</text>
  <rect x="460" y="335" width="16" height="16" fill="#e2e8f0" stroke="#a0aec0" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="484" y="348" font-size="13" fill="#2d3748">바꿈: 로고·사진·이름·가격·지역명</text>
</svg>
