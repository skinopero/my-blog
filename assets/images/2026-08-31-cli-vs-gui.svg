<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#fbfbfb"/>

  <!-- GUI panel -->
  <rect x="20" y="20" width="370" height="380" rx="24" fill="#eaf3ff" stroke="#bcd9ff" stroke-width="2"/>
  <text x="205" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#2b6cb0">GUI</text>
  <text x="205" y="86" text-anchor="middle" font-size="15" fill="#4a5568">그림 버튼을 눌러서 시키기</text>

  <!-- robot (GUI) -->
  <g transform="translate(120,140)">
    <rect x="0" y="30" width="90" height="80" rx="14" fill="#90cdf4" stroke="#2b6cb0" stroke-width="3"/>
    <circle cx="45" cy="0" r="34" fill="#bee3f8" stroke="#2b6cb0" stroke-width="3"/>
    <circle cx="32" cy="-4" r="5" fill="#2b6cb0"/>
    <circle cx="58" cy="-4" r="5" fill="#2b6cb0"/>
    <rect x="20" y="14" width="50" height="6" rx="3" fill="#2b6cb0"/>
  </g>

  <!-- hand clicking a button -->
  <g transform="translate(250,190)">
    <rect x="0" y="0" width="90" height="60" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="3"/>
    <rect x="14" y="14" width="62" height="32" rx="8" fill="#4299e1"/>
    <text x="45" y="36" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">CLICK</text>
    <path d="M45 70 L60 100 L70 90 L80 115 L60 120 L45 108 Z" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
  </g>

  <text x="205" y="330" text-anchor="middle" font-size="15" fill="#2d3748">"이 버튼 누르면 되겠지?"</text>
  <text x="205" y="352" text-anchor="middle" font-size="13" fill="#718096">배우긴 쉽지만, 도구가 만든 버튼 안에서만 할 수 있어요</text>

  <!-- CLI panel -->
  <rect x="410" y="20" width="370" height="380" rx="24" fill="#1a202c"/>
  <text x="595" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#68d391">CLI</text>
  <text x="595" y="86" text-anchor="middle" font-size="15" fill="#cbd5e0">말(글자)로 직접 시키기</text>

  <!-- robot (CLI) -->
  <g transform="translate(510,140)">
    <rect x="0" y="30" width="90" height="80" rx="14" fill="#2f855a" stroke="#68d391" stroke-width="3"/>
    <circle cx="45" cy="0" r="34" fill="#276749" stroke="#68d391" stroke-width="3"/>
    <circle cx="32" cy="-4" r="5" fill="#68d391"/>
    <circle cx="58" cy="-4" r="5" fill="#68d391"/>
    <rect x="20" y="14" width="50" height="6" rx="3" fill="#68d391"/>
  </g>

  <!-- speech bubble with command -->
  <g transform="translate(600,150)">
    <path d="M0 10 Q0 0 10 0 L150 0 Q160 0 160 10 L160 60 Q160 70 150 70 L30 70 L10 90 L14 70 L10 70 Q0 70 0 60 Z" fill="#0d1117" stroke="#68d391" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-size="13" fill="#68d391" font-family="monospace">git branch</text>
    <text x="80" y="52" text-anchor="middle" font-size="13" fill="#68d391" font-family="monospace">feature-test</text>
  </g>

  <text x="595" y="330" text-anchor="middle" font-size="15" fill="#e2e8f0">"이 말(명령어)로 시키면 돼"</text>
  <text x="595" y="352" text-anchor="middle" font-size="13" fill="#a0aec0">외우는 덴 시간이 걸리지만, 내가 원하는 대로 시킬 수 있어요</text>
</svg>
