<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#fbfbfb"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">작은 블록(컴포넌트)을 끼워서 화면 하나를 만들어요</text>

  <rect x="40" y="55" width="150" height="50" rx="10" fill="#2b6cb0" opacity="0.18" stroke="#2b6cb0" stroke-width="2"/>
  <text x="115" y="85" text-anchor="middle" font-size="14" fill="#2d3748">&lt;Header /&gt;</text>
  <rect x="40" y="115" width="150" height="40" rx="10" fill="#dd6b20" opacity="0.18" stroke="#dd6b20" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="14" fill="#2d3748">&lt;NavBar /&gt;</text>
  <rect x="40" y="165" width="150" height="50" rx="10" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="115" y="195" text-anchor="middle" font-size="14" fill="#2d3748">&lt;Main /&gt;</text>
  <rect x="40" y="225" width="150" height="40" rx="10" fill="#2b6cb0" opacity="0.18" stroke="#2b6cb0" stroke-width="2"/>
  <text x="115" y="250" text-anchor="middle" font-size="14" fill="#2d3748">&lt;Footer /&gt;</text>

  <line x1="196" y1="160" x2="290" y2="160" stroke="#2d3748" stroke-width="2.5"/>
  <polygon points="290,154 302,160 290,166" fill="#2d3748"/>
  <text x="246" y="148" text-anchor="middle" font-size="11" fill="#5B6884">조립</text>

  <rect x="308" y="55" width="200" height="210" rx="14" fill="#fff5d6" stroke="#2d3748" stroke-width="2"/>
  <text x="408" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">&lt;MainLayout /&gt;</text>
  <rect x="326" y="96" width="164" height="30" rx="6" fill="#fbfbfb" stroke="#cbd5e0"/>
  <text x="408" y="116" text-anchor="middle" font-size="12" fill="#2d3748">헤더</text>
  <rect x="326" y="132" width="164" height="30" rx="6" fill="#fbfbfb" stroke="#cbd5e0"/>
  <text x="408" y="152" text-anchor="middle" font-size="12" fill="#2d3748">네비게이션 바</text>
  <rect x="326" y="168" width="164" height="30" rx="6" fill="#fbfbfb" stroke="#cbd5e0"/>
  <text x="408" y="188" text-anchor="middle" font-size="12" fill="#2d3748">메인</text>
  <rect x="326" y="204" width="164" height="30" rx="6" fill="#fbfbfb" stroke="#cbd5e0"/>
  <text x="408" y="224" text-anchor="middle" font-size="12" fill="#2d3748">푸터</text>

  <line x1="514" y1="160" x2="590" y2="160" stroke="#2d3748" stroke-width="2.5"/>
  <polygon points="590,154 602,160 590,166" fill="#2d3748"/>
  <text x="552" y="148" text-anchor="middle" font-size="11" fill="#5B6884">render</text>

  <rect x="608" y="105" width="150" height="110" rx="12" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="683" y="135" text-anchor="middle" font-size="13" fill="#2d3748">브라우저 화면</text>
  <text x="683" y="158" text-anchor="middle" font-size="11" fill="#5B6884">ReactDOM</text>
  <text x="683" y="176" text-anchor="middle" font-size="11" fill="#5B6884">.createRoot(...)</text>
  <text x="683" y="194" text-anchor="middle" font-size="11" fill="#5B6884">.render(...)</text>

  <text x="400" y="288" text-anchor="middle" font-size="12" fill="#5B6884">블록 이름은 대문자로 시작해야 해요. 소문자면 그냥 HTML 태그로 읽혀요.</text>
</svg>
