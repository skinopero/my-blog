<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="380" fill="#fbfbfb"/>

  <!-- main paper -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="220" height="260" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="3"/>
    <text x="110" y="-15" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">main 종이</text>
    <!-- simple house drawing -->
    <polygon points="60,120 110,70 160,120" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
    <rect x="70" y="120" width="80" height="70" fill="#fbd38d" stroke="#c05621" stroke-width="2"/>
    <rect x="98" y="150" width="24" height="40" fill="#c05621"/>
    <circle cx="60" cy="230" r="18" fill="#f6e05e" stroke="#b7791f" stroke-width="2"/>
    <text x="110" y="245" text-anchor="middle" font-size="12" fill="#a0aec0">(원본은 그대로 안전)</text>
  </g>

  <!-- copy arrow -->
  <g transform="translate(310,150)">
    <path d="M0 40 L150 40" stroke="#2b6cb0" stroke-width="6" fill="none"/>
    <polygon points="150,25 190,40 150,55" fill="#2b6cb0"/>
    <text x="95" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">복사!</text>
    <text x="95" y="70" text-anchor="middle" font-size="12" fill="#4a5568">git branch feature-test</text>
  </g>

  <!-- branch paper -->
  <g transform="translate(520,60)">
    <rect x="0" y="0" width="220" height="260" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="3" stroke-dasharray="8 4"/>
    <text x="110" y="-15" text-anchor="middle" font-size="18" font-weight="bold" fill="#dd6b20">내 브랜치 종이</text>
    <!-- same house drawing -->
    <polygon points="60,120 110,70 160,120" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
    <rect x="70" y="120" width="80" height="70" fill="#fbd38d" stroke="#c05621" stroke-width="2"/>
    <rect x="98" y="150" width="24" height="40" fill="#c05621"/>
    <circle cx="60" cy="230" r="18" fill="#f6e05e" stroke="#b7791f" stroke-width="2"/>
    <!-- new scribble added on branch -->
    <path d="M150 210 q15 -20 30 0 q15 20 30 0" stroke="#38a169" stroke-width="4" fill="none"/>
    <text x="180" y="248" text-anchor="middle" font-size="12" fill="#38a169">여기서 마음껏 낙서!</text>
  </g>
</svg>
