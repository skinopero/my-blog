<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#fbfbfb"/>

  <text x="24" y="28" font-size="14" font-weight="bold" fill="#2d3748">session.getAttribute()를 부르기 전에, session 자체가 null일 수 있다</text>

  <rect x="40" y="56" width="190" height="46" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="1.5"/>
  <text x="135" y="84" font-size="12.5" text-anchor="middle" fill="#2d3748">req.getSession(false)</text>

  <path d="M230 79 H310" stroke="#2d3748" stroke-width="1.5" marker-end="url(#na)"/>

  <polygon points="380,56 460,79 380,102 300,79" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="380" y="83" font-size="11" text-anchor="middle" fill="#1a365d">세션이 있나?</text>

  <!-- yes path -->
  <path d="M460 79 H540" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#na2)"/>
  <text x="500" y="70" font-size="10.5" fill="#2b6cb0" text-anchor="middle">있음</text>
  <rect x="542" y="56" width="190" height="46" rx="8" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="637" y="78" font-size="11.5" text-anchor="middle" fill="#2d3748">session.getAttribute(...)</text>
  <text x="637" y="94" font-size="10" text-anchor="middle" fill="#718096">정상 동작</text>

  <!-- no path -->
  <path d="M380 102 V140" stroke="#dd6b20" stroke-width="1.5" marker-end="url(#na3)"/>
  <text x="400" y="125" font-size="10.5" fill="#dd6b20">없음 → null</text>

  <rect x="260" y="150" width="240" height="46" rx="8" fill="#fff5f5" stroke="#dd6b20" stroke-width="2"/>
  <text x="380" y="172" font-size="11.5" text-anchor="middle" fill="#7b341e">session 변수 = null</text>
  <text x="380" y="188" font-size="10" text-anchor="middle" fill="#7b341e">(getSession(false)라서 새로 만들지 않음)</text>

  <path d="M380 196 V224" stroke="#c53030" stroke-width="2" marker-end="url(#na4)"/>

  <rect x="230" y="226" width="300" height="46" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="380" y="248" font-size="12" font-weight="bold" text-anchor="middle" fill="#742a2a">null.getAttribute("loggedInUser")</text>
  <text x="380" y="264" font-size="10.5" text-anchor="middle" fill="#742a2a">NullPointerException!</text>

  <path d="M380 272 V300" stroke="#c53030" stroke-width="2" marker-end="url(#na4)"/>
  <rect x="300" y="302" width="160" height="34" rx="6" fill="#742a2a"/>
  <text x="380" y="324" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">500 Internal Server Error</text>

  <defs>
    <marker id="na" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2d3748"/></marker>
    <marker id="na2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2b6cb0"/></marker>
    <marker id="na3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dd6b20"/></marker>
    <marker id="na4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c53030"/></marker>
  </defs>
</svg>
