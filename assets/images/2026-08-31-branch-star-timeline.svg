<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="260" fill="#fbfbfb"/>

  <line x1="60" y1="130" x2="840" y2="130" stroke="#cbd5e0" stroke-width="4"/>

  <!-- S -->
  <g transform="translate(60,60)">
    <circle cx="30" cy="70" r="30" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="30" y="78" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a5568">S</text>
    <text x="30" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3748">Situation</text>
    <text x="30" y="-10" text-anchor="middle" font-size="11" fill="#718096">디자인을</text>
    <text x="30" y="6" text-anchor="middle" font-size="11" fill="#718096">실험하고 싶다</text>
  </g>

  <!-- T -->
  <g transform="translate(280,60)">
    <circle cx="30" cy="70" r="30" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="30" y="78" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">T</text>
    <text x="30" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3748">Task</text>
    <text x="30" y="-10" text-anchor="middle" font-size="11" fill="#718096">main은</text>
    <text x="30" y="6" text-anchor="middle" font-size="11" fill="#718096">안전하게 유지</text>
  </g>

  <!-- A -->
  <g transform="translate(500,60)">
    <circle cx="30" cy="70" r="30" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <text x="30" y="78" text-anchor="middle" font-size="20" font-weight="bold" fill="#dd6b20">A</text>
    <text x="30" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3748">Action</text>
    <text x="30" y="-10" text-anchor="middle" font-size="11" fill="#718096">checkout -b test</text>
    <text x="30" y="6" text-anchor="middle" font-size="11" fill="#718096">로 실험</text>
  </g>

  <!-- R -->
  <g transform="translate(720,60)">
    <circle cx="30" cy="70" r="30" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
    <text x="30" y="78" text-anchor="middle" font-size="20" font-weight="bold" fill="#38a169">R</text>
    <text x="30" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3748">Result</text>
    <text x="30" y="-10" text-anchor="middle" font-size="11" fill="#718096">branch -d로</text>
    <text x="30" y="6" text-anchor="middle" font-size="11" fill="#718096">안전하게 정리</text>
  </g>

  <path d="M180 130 L260 130" stroke="#a0aec0" stroke-width="3" fill="none"/>
  <polygon points="260,124 274,130 260,136" fill="#a0aec0"/>
  <path d="M400 130 L480 130" stroke="#a0aec0" stroke-width="3" fill="none"/>
  <polygon points="480,124 494,130 480,136" fill="#a0aec0"/>
  <path d="M620 130 L700 130" stroke="#a0aec0" stroke-width="3" fill="none"/>
  <polygon points="700,124 714,130 700,136" fill="#a0aec0"/>
</svg>
