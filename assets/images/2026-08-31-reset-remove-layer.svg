<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="700" height="340" fill="#fbfbfb"/>

  <!-- before -->
  <g transform="translate(90,60)">
    <text x="80" y="-15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">지금</text>
    <rect x="20" y="160" width="120" height="50" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <text x="80" y="190" text-anchor="middle" font-size="12" fill="#2d3748">블록 1</text>
    <rect x="20" y="105" width="120" height="50" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <text x="80" y="135" text-anchor="middle" font-size="12" fill="#2d3748">블록 2</text>
    <rect x="20" y="50" width="120" height="50" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
    <text x="80" y="80" text-anchor="middle" font-size="12" fill="#742a2a">블록 3 (잘못 쌓음)</text>
  </g>

  <g transform="translate(280,150)">
    <path d="M0 20 L100 20" stroke="#805ad5" stroke-width="5" fill="none"/>
    <polygon points="100,6 138,20 100,34" fill="#805ad5"/>
    <text x="69" y="0" text-anchor="middle" font-size="13" font-family="monospace" fill="#805ad5">git reset</text>
  </g>

  <!-- after -->
  <g transform="translate(470,60)">
    <text x="80" y="-15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">되돌린 뒤</text>
    <rect x="20" y="160" width="120" height="50" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <text x="80" y="190" text-anchor="middle" font-size="12" fill="#2d3748">블록 1</text>
    <rect x="20" y="105" width="120" height="50" fill="#c6f6d5" stroke="#2f855a" stroke-width="3"/>
    <text x="80" y="135" text-anchor="middle" font-size="12" fill="#276749">블록 2 (여기로 복귀)</text>
    <rect x="20" y="50" width="120" height="50" fill="none" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="80" y="80" text-anchor="middle" font-size="11" fill="#cbd5e0">블록 3 사라짐</text>
  </g>

  <text x="350" y="300" text-anchor="middle" font-size="12" fill="#a0aec0">문제가 생긴 층 이전 상태로 되돌아간다</text>
</svg>
