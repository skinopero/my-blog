<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2d3748"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#fbfbfb"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">같은 상자를 가리키기 vs 내용을 새 상자에 옮기기</text>

  <!-- left: reference -->
  <text x="200" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#dd6b20">const cartRef = cart</text>
  <rect x="40" y="82" width="90" height="34" rx="8" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="85" y="104" text-anchor="middle" font-size="13" fill="#2d3748">cart</text>
  <rect x="40" y="136" width="90" height="34" rx="8" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="85" y="158" text-anchor="middle" font-size="13" fill="#2d3748">cartRef</text>
  <line x1="130" y1="99" x2="215" y2="125" stroke="#2d3748" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="130" y1="153" x2="215" y2="135" stroke="#2d3748" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="222" y="95" width="150" height="70" rx="10" fill="#dd6b20" opacity="0.15" stroke="#dd6b20" stroke-width="2"/>
  <text x="297" y="122" text-anchor="middle" font-size="13" fill="#2d3748">치킨, 피자, 파스타</text>
  <text x="297" y="144" text-anchor="middle" font-size="11" fill="#5B6884">상자는 하나뿐</text>
  <text x="200" y="205" text-anchor="middle" font-size="13" fill="#2d3748">cartRef에 넣으면 cart도 바뀌어요</text>

  <line x1="400" y1="50" x2="400" y2="270" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- right: spread -->
  <text x="600" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">const cartCopy = [...cart]</text>
  <rect x="440" y="82" width="90" height="34" rx="8" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="485" y="104" text-anchor="middle" font-size="13" fill="#2d3748">cart</text>
  <rect x="440" y="136" width="90" height="34" rx="8" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="485" y="158" text-anchor="middle" font-size="13" fill="#2d3748">cartCopy</text>
  <line x1="530" y1="99" x2="600" y2="99" stroke="#2d3748" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="530" y1="153" x2="600" y2="153" stroke="#2d3748" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="606" y="80" width="170" height="40" rx="10" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="691" y="105" text-anchor="middle" font-size="12" fill="#2d3748">치킨, 피자</text>
  <rect x="606" y="134" width="170" height="40" rx="10" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="691" y="159" text-anchor="middle" font-size="12" fill="#2d3748">치킨, 피자, 빠네파스타</text>
  <text x="600" y="205" text-anchor="middle" font-size="13" fill="#2d3748">새 상자라서 서로 영향이 없어요</text>

  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#5B6884">단, 스프레드는 1단계만 옮겨요. 상자 안에 또 상자(객체)가 있으면 그건 같이 쓰게 돼요.</text>
</svg>
