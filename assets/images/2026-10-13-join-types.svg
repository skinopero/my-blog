<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="740" height="260" fill="#fbfbfb"/>
  <text x="370" y="24" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">INNER JOIN은 교집합, LEFT JOIN은 왼쪽 전부 + 짝 없으면 NULL</text>

  <!-- INNER JOIN -->
  <text x="150" y="55" font-size="12.5" font-weight="bold" fill="#2d3748" text-anchor="middle">INNER JOIN</text>
  <circle cx="115" cy="110" r="55" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2" fill-opacity="0.6"/>
  <circle cx="185" cy="110" r="55" fill="#fff5f5" stroke="#dd6b20" stroke-width="2" fill-opacity="0.6"/>
  <path d="M150 65 A55 55 0 0 1 150 155 A55 55 0 0 1 150 65 Z" fill="#dff5e6" stroke="#188a5e" stroke-width="2"/>
  <text x="80" y="115" font-size="10" fill="#1a365d">users</text>
  <text x="210" y="115" font-size="10" fill="#7b341e">courses</text>
  <text x="150" y="190" font-size="10.5" fill="#15513c" text-anchor="middle">양쪽에 짝이 있는 행만</text>

  <!-- LEFT JOIN -->
  <text x="570" y="55" font-size="12.5" font-weight="bold" fill="#2d3748" text-anchor="middle">LEFT JOIN</text>
  <circle cx="535" cy="110" r="55" fill="#dff5e6" stroke="#188a5e" stroke-width="2" fill-opacity="0.7"/>
  <circle cx="605" cy="110" r="55" fill="#fff" stroke="#dd6b20" stroke-width="2" fill-opacity="0.3"/>
  <text x="500" y="115" font-size="10" fill="#15513c">users</text>
  <text x="630" y="115" font-size="10" fill="#7b341e">uap</text>
  <text x="570" y="190" font-size="10.5" fill="#15513c" text-anchor="middle">users 전부 + 짝 없으면 NULL</text>

  <text x="370" y="235" font-size="11" fill="#2d3748" text-anchor="middle">강도윤 학생처럼 짝(성적)이 없으면 INNER JOIN은 아예 빠지고, LEFT JOIN은 NULL로라도 남는다</text>
</svg>
