<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="400" fill="#fbfbfb"/>

  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">상자에 스티커(속성)를 붙일 수 있어요</text>

  <!-- image box -->
  <rect x="310" y="140" width="200" height="140" rx="10" fill="#e6fffa" stroke="#2c7a7b" stroke-width="3"/>
  <text x="410" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c7a7b">&lt;img&gt;</text>
  <!-- mini picture icon -->
  <rect x="345" y="190" width="130" height="70" rx="6" fill="#fff" stroke="#2c7a7b" stroke-width="2"/>
  <circle cx="370" cy="215" r="8" fill="#f6e05e"/>
  <polygon points="345,260 385,225 410,245 440,205 475,260" fill="#68d391"/>

  <!-- sticker 1: src -->
  <g>
    <line x1="310" y1="180" x2="140" y2="110" stroke="#c05621" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="40" y="70" width="220" height="60" rx="30" fill="#feebc8" stroke="#c05621" stroke-width="2"/>
    <text x="150" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c4221">src="고양이.jpg"</text>
    <text x="150" y="115" text-anchor="middle" font-size="11" fill="#9c4221">어떤 그림을 보여줄지 알려줌</text>
  </g>

  <!-- sticker 2: alt -->
  <g>
    <line x1="510" y1="230" x2="680" y2="300" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="560" y="290" width="230" height="60" rx="30" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
    <text x="675" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">alt="고양이 사진"</text>
    <text x="675" y="335" text-anchor="middle" font-size="11" fill="#2b6cb0">그림이 안 보일 때 대신 읽어줌</text>
  </g>

  <text x="410" y="380" text-anchor="middle" font-size="13" fill="#a0aec0">스티커(속성)는 여는 뚜껑 안에 "이름=값" 모양으로 붙여요</text>
</svg>
