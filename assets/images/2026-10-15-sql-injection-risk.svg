<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#fbfbfb"/>

  <text x="24" y="28" font-size="14" font-weight="bold" fill="#2d3748">문자열을 이어붙이면, 입력값이 SQL 구문의 일부가 되어버린다</text>

  <text x="24" y="60" font-size="12" fill="#2d3748">코드: "WHERE MENU_NAME = '" + menuName + "'"</text>

  <rect x="24" y="76" width="340" height="40" rx="6" fill="#edf2f7" stroke="#2d3748" stroke-width="1.25"/>
  <text x="34" y="100" font-size="11.5" fill="#2d3748">menuName = "쭈꾸미덮밥" (정상 입력)</text>

  <rect x="24" y="126" width="700" height="34" rx="6" fill="#fff" stroke="#188a5e" stroke-width="1.5"/>
  <text x="34" y="148" font-size="11" fill="#188a5e">WHERE MENU_NAME = '쭈꾸미덮밥'  ← 의도한 대로 동작</text>

  <rect x="24" y="178" width="340" height="40" rx="6" fill="#fff5f5" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="34" y="202" font-size="11.5" fill="#7b341e">menuName = "x' OR '1'='1" (악의적 입력)</text>

  <rect x="24" y="228" width="700" height="34" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="34" y="250" font-size="11" fill="#742a2a">WHERE MENU_NAME = 'x' OR '1'='1'  ← 조건이 항상 참! 전체 행이 다 조회된다</text>

  <text x="380" y="285" font-size="12" fill="#2d3748" text-anchor="middle">입력값에 포함된 따옴표(')가 SQL 문법의 일부로 해석되는 게 근본 원인이다</text>
</svg>
