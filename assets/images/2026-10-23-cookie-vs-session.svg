<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="320" fill="#fbfbfb"/>

  <!-- Cookie side -->
  <text x="190" y="30" font-size="14" font-weight="bold" fill="#dd6b20" text-anchor="middle">쿠키 — 손님이 직접 들고 다니는 영수증</text>
  <circle cx="110" cy="130" r="28" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="110" y="136" font-size="20" text-anchor="middle">🙋</text>
  <rect x="150" y="105" width="110" height="50" rx="8" fill="#fff5f5" stroke="#dd6b20" stroke-width="2"/>
  <text x="205" y="126" font-size="11" text-anchor="middle" fill="#7b341e">🧾 영수증</text>
  <text x="205" y="142" font-size="9.5" text-anchor="middle" fill="#7b341e">userValue=abc</text>
  <text x="190" y="185" font-size="11" fill="#2d3748" text-anchor="middle">내용은 손님(브라우저) 손에 있고,</text>
  <text x="190" y="202" font-size="11" fill="#2d3748" text-anchor="middle">요청마다 자동으로 같이 제출된다</text>
  <text x="190" y="225" font-size="10.5" fill="#718096" text-anchor="middle">resp.addCookie() · req.getCookies()</text>

  <line x1="380" y1="20" x2="380" y2="300" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Session side -->
  <text x="570" y="30" font-size="14" font-weight="bold" fill="#2b6cb0" text-anchor="middle">세션 — 가게 장부 + 손님은 번호표만</text>
  <circle cx="490" cy="130" r="28" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="490" y="136" font-size="20" text-anchor="middle">🙋</text>
  <rect x="528" y="112" width="70" height="36" rx="18" fill="#fff" stroke="#2d3748" stroke-width="1.5"/>
  <text x="563" y="134" font-size="10" text-anchor="middle" fill="#2d3748">JSESSIONID</text>

  <rect x="620" y="90" width="110" height="90" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="675" y="112" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a365d">서버 장부</text>
  <text x="675" y="132" font-size="9.5" text-anchor="middle" fill="#1a365d">loggedInUser</text>
  <text x="675" y="148" font-size="9.5" text-anchor="middle" fill="#1a365d">= 홍길동</text>
  <text x="675" y="166" font-size="9" text-anchor="middle" fill="#718096">(30초 후 만료)</text>

  <path d="M598 130 H618" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ca)"/>

  <text x="570" y="205" font-size="11" fill="#2d3748" text-anchor="middle">실제 데이터는 서버에만 있고,</text>
  <text x="570" y="222" font-size="11" fill="#2d3748" text-anchor="middle">손님은 번호표(세션ID)만 들고 있다</text>
  <text x="570" y="245" font-size="10.5" fill="#718096" text-anchor="middle">session.setAttribute() · session.invalidate()</text>

  <defs>
    <marker id="ca" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b6cb0"/>
    </marker>
  </defs>
</svg>
