<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2d3748"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" fill="#fbfbfb"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">요리는 누가, 어디서 완성할까</text>

  <!-- SSR -->
  <rect x="20" y="50" width="240" height="230" rx="14" fill="#2b6cb0" opacity="0.1" stroke="#2b6cb0" stroke-width="2"/>
  <text x="140" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">SSR (Thymeleaf)</text>
  <rect x="40" y="94" width="200" height="40" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="140" y="119" text-anchor="middle" font-size="12" fill="#2d3748">주방(서버)이 완성해서</text>
  <line x1="140" y1="136" x2="140" y2="160" stroke="#2d3748" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="40" y="164" width="200" height="40" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="140" y="189" text-anchor="middle" font-size="12" fill="#2d3748">접시째 가져다줘요 (완성된 HTML)</text>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#5B6884">손님은 받아서 먹기만 해요</text>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#5B6884">메뉴를 바꾸면 새 접시가 와요</text>

  <!-- CSR -->
  <rect x="280" y="50" width="240" height="230" rx="14" fill="#dd6b20" opacity="0.1" stroke="#dd6b20" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#dd6b20">CSR (React + Vite)</text>
  <rect x="300" y="94" width="200" height="40" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="400" y="119" text-anchor="middle" font-size="12" fill="#2d3748">빈 접시 + 조리 키트(JS)를 보내요</text>
  <line x1="400" y1="136" x2="400" y2="160" stroke="#2d3748" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="300" y="164" width="200" height="40" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="400" y="189" text-anchor="middle" font-size="12" fill="#2d3748">손님 자리(브라우저)에서 조리</text>
  <text x="400" y="232" text-anchor="middle" font-size="11" fill="#5B6884">재료(데이터)만 API로 받아와요</text>
  <text x="400" y="252" text-anchor="middle" font-size="11" fill="#5B6884">메뉴를 바꿔도 접시는 그대로</text>

  <!-- Next -->
  <rect x="540" y="50" width="240" height="230" rx="14" fill="#2d3748" opacity="0.08" stroke="#2d3748" stroke-width="2"/>
  <text x="660" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d3748">Next</text>
  <rect x="560" y="94" width="200" height="40" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="660" y="119" text-anchor="middle" font-size="12" fill="#2d3748">처음엔 주방이 완성해서 내줘요</text>
  <line x1="660" y1="136" x2="660" y2="160" stroke="#2d3748" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="560" y="164" width="200" height="40" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="660" y="189" text-anchor="middle" font-size="12" fill="#2d3748">자리에서 마무리 (hydration)</text>
  <text x="660" y="232" text-anchor="middle" font-size="11" fill="#5B6884">그다음 이동부터는</text>
  <text x="660" y="252" text-anchor="middle" font-size="11" fill="#5B6884">클라이언트에서 처리해요</text>

  <text x="400" y="312" text-anchor="middle" font-size="12" fill="#5B6884">SSR과 CSR은 "HTML을 어디서 만드는가"의 차이예요.</text>
</svg>
