<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#fbfbfb"/>

  <!-- client -->
  <circle cx="60" cy="150" r="30" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="60" y="155" font-size="22" text-anchor="middle">🙋</text>
  <text x="60" y="200" font-size="12" fill="#2d3748" text-anchor="middle">클라이언트</text>

  <!-- servlet A -->
  <rect x="160" y="100" width="190" height="100" rx="10" fill="#edf2f7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="255" y="130" font-size="13" font-weight="bold" fill="#2b6cb0" text-anchor="middle">RequestInfoServlet</text>
  <text x="255" y="150" font-size="11" fill="#2d3748" text-anchor="middle">/forward</text>
  <text x="255" y="170" font-size="11" fill="#2d3748" text-anchor="middle">로그인 처리(비즈니스 로직)</text>
  <text x="255" y="188" font-size="10.5" fill="#718096" text-anchor="middle">req.setAttribute("userId", id)</text>

  <!-- servlet B -->
  <rect x="470" y="100" width="190" height="100" rx="10" fill="#fff5f5" stroke="#dd6b20" stroke-width="2"/>
  <text x="565" y="130" font-size="13" font-weight="bold" fill="#dd6b20" text-anchor="middle">ResponseLoginServlet</text>
  <text x="565" y="150" font-size="11" fill="#2d3748" text-anchor="middle">/print</text>
  <text x="565" y="170" font-size="11" fill="#2d3748" text-anchor="middle">응답 HTML 작성</text>
  <text x="565" y="188" font-size="10.5" fill="#718096" text-anchor="middle">req.getAttribute("userId")</text>

  <!-- arrows -->
  <path d="M90 150 H158" stroke="#2d3748" stroke-width="1.5" marker-end="url(#fa)"/>
  <text x="124" y="140" font-size="10.5" fill="#718096" text-anchor="middle">요청</text>

  <path d="M350 150 H468" stroke="#2b6cb0" stroke-width="2" marker-end="url(#fa2)"/>
  <text x="409" y="140" font-size="11" font-weight="bold" fill="#2b6cb0" text-anchor="middle">forward (같은 req, resp 공유)</text>

  <path d="M660 185 C 700 230, 300 260, 90 185" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fa)"/>
  <text x="380" y="255" font-size="10.5" fill="#718096" text-anchor="middle">응답 — 클라이언트는 /print의 존재를 모른다 (URL 그대로 /forward)</text>

  <defs>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2d3748"/>
    </marker>
    <marker id="fa2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b6cb0"/>
    </marker>
  </defs>
</svg>
