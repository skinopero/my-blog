<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="740" height="240" fill="#fbfbfb"/>
  <text x="370" y="24" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">AND가 OR보다 먼저 묶인다</text>

  <text x="30" y="60" font-size="12.5" fill="#2d3748">job_code = 'J2'  AND  salary &gt;= 200  OR  job_code = 'J7'</text>

  <path d="M90 70 C 90 90, 290 90, 290 70" fill="none" stroke="#188a5e" stroke-width="2"/>
  <text x="190" y="105" font-size="11" fill="#188a5e" text-anchor="middle">① 먼저 AND로 묶임</text>

  <path d="M30 118 C 30 140, 520 140, 520 118" fill="none" stroke="#dd6b20" stroke-width="2"/>
  <text x="275" y="155" font-size="11" fill="#dd6b20" text-anchor="middle">② 그 결과를 OR로 다시 묶음</text>

  <rect x="30" y="175" width="680" height="40" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="370" y="200" font-size="11.5" fill="#742a2a" text-anchor="middle">실제 의미: (job_code='J2' AND salary&gt;=200) OR (job_code='J7') — J7이면 급여 조건 없이도 포함!</text>

  <text x="370" y="232" font-size="11" fill="#2d3748" text-anchor="middle">의도와 다르게 동작한다면, 괄호 ( )로 묶는 순서를 직접 정해줘야 한다</text>
</svg>
