<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="840" height="480" fill="#fbfbfb"/>

  <!-- Panel A: git branch test -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="380" height="200" rx="12" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="190" y="28" text-anchor="middle" font-size="14" font-family="monospace" fill="#2d3748">git branch test</text>

    <rect x="150" y="120" width="70" height="40" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <line x1="185" y1="120" x2="185" y2="80" stroke="#2b6cb0" stroke-width="3"/>
    <polygon points="185,80 185,60 225,70" fill="#2b6cb0"/>
    <line x1="230" y1="120" x2="230" y2="90" stroke="#dd6b20" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="230,90 230,72 265,81" fill="none" stroke="#dd6b20" stroke-width="2" stroke-dasharray="3 2"/>

    <circle cx="185" cy="150" r="9" fill="#4a5568"/>
    <line x1="185" y1="159" x2="185" y2="175" stroke="#4a5568" stroke-width="3"/>

    <text x="190" y="190" text-anchor="middle" font-size="12" fill="#4a5568">깃발만 새로 만든다 (이동 X)</text>
  </g>

  <!-- Panel B: git checkout test -->
  <g transform="translate(440,20)">
    <rect x="0" y="0" width="380" height="200" rx="12" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="190" y="28" text-anchor="middle" font-size="14" font-family="monospace" fill="#2d3748">git checkout test</text>

    <rect x="60" y="120" width="70" height="40" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <line x1="95" y1="120" x2="95" y2="80" stroke="#2b6cb0" stroke-width="3"/>
    <polygon points="95,80 95,60 135,70" fill="#2b6cb0"/>

    <rect x="250" y="120" width="70" height="40" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="285" y1="120" x2="285" y2="80" stroke="#dd6b20" stroke-width="3"/>
    <polygon points="285,80 285,60 325,70" fill="#dd6b20"/>

    <path d="M110 150 Q190 110 265 150" stroke="#4a5568" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
    <polygon points="265,150 250,138 250,158" fill="#4a5568"/>
    <circle cx="95" cy="150" r="9" fill="#a0aec0"/>

    <text x="190" y="190" text-anchor="middle" font-size="12" fill="#4a5568">이미 있는 깃발로 이동</text>
  </g>

  <!-- Panel C: git checkout -b test -->
  <g transform="translate(20,260)">
    <rect x="0" y="0" width="380" height="200" rx="12" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="190" y="28" text-anchor="middle" font-size="14" font-family="monospace" fill="#2d3748">git checkout -b test</text>

    <rect x="150" y="120" width="70" height="40" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <line x1="185" y1="120" x2="185" y2="80" stroke="#2b6cb0" stroke-width="3"/>
    <polygon points="185,80 185,60 225,70" fill="#2b6cb0"/>

    <rect x="150" y="120" width="70" height="40" fill="none"/>
    <line x1="230" y1="120" x2="230" y2="80" stroke="#dd6b20" stroke-width="3"/>
    <polygon points="230,80 230,60 270,70" fill="#dd6b20"/>
    <text x="270" y="55" font-size="16" fill="#dd6b20">✦</text>

    <circle cx="230" cy="150" r="9" fill="#dd6b20"/>
    <line x1="230" y1="159" x2="230" y2="175" stroke="#dd6b20" stroke-width="3"/>

    <text x="190" y="190" text-anchor="middle" font-size="12" fill="#4a5568">만들면서 동시에 이동</text>
  </g>

  <!-- Panel D: git branch -d test -->
  <g transform="translate(440,260)">
    <rect x="0" y="0" width="380" height="200" rx="12" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="190" y="28" text-anchor="middle" font-size="14" font-family="monospace" fill="#2d3748">git branch -d test</text>

    <rect x="150" y="120" width="70" height="40" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
    <line x1="185" y1="120" x2="185" y2="80" stroke="#cbd5e0" stroke-width="3"/>
    <polygon points="185,80 185,60 225,70" fill="#cbd5e0"/>
    <line x1="170" y1="55" x2="200" y2="85" stroke="#e53e3e" stroke-width="4"/>
    <line x1="200" y1="55" x2="170" y2="85" stroke="#e53e3e" stroke-width="4"/>

    <polygon points="255,150 305,150 295,190 265,190" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
    <line x1="253" y1="150" x2="307" y2="150" stroke="#4a5568" stroke-width="2"/>

    <text x="190" y="190" text-anchor="middle" font-size="12" fill="#4a5568">다 쓴 깃발 정리(삭제)</text>
  </g>
</svg>
