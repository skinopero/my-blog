<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#fbfbfb"/>

  <!-- left paper: orange sky -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="220" height="180" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="3"/>
    <rect x="10" y="10" width="200" height="90" fill="#f6ad55"/>
    <rect x="0" y="100" width="220" height="80" fill="#9ae6b4"/>
    <text x="110" y="-15" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d3748">브랜치 A</text>
    <text x="110" y="200" text-anchor="middle" font-size="13" fill="#c05621">하늘을 주황색으로 칠함</text>
  </g>

  <!-- right paper: blue sky -->
  <g transform="translate(540,40)">
    <rect x="0" y="0" width="220" height="180" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="3"/>
    <rect x="10" y="10" width="200" height="90" fill="#63b3ed"/>
    <rect x="0" y="100" width="220" height="80" fill="#9ae6b4"/>
    <text x="110" y="-15" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d3748">브랜치 B</text>
    <text x="110" y="200" text-anchor="middle" font-size="13" fill="#2b6cb0">하늘을 파란색으로 칠함</text>
  </g>

  <!-- arrows converging -->
  <path d="M150 260 L370 340" stroke="#a0aec0" stroke-width="5" fill="none"/>
  <path d="M650 260 L430 340" stroke="#a0aec0" stroke-width="5" fill="none"/>

  <!-- merge attempt box -->
  <g transform="translate(300,340)">
    <rect x="0" y="0" width="200" height="100" rx="14" fill="#fff5f5" stroke="#e53e3e" stroke-width="3"/>
    <text x="100" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#c53030">CONFLICT!</text>
    <text x="100" y="58" text-anchor="middle" font-size="12" fill="#742a2a">하늘, 주황? 파랑?</text>
    <text x="100" y="78" text-anchor="middle" font-size="12" fill="#742a2a">로봇이 못 정해서</text>
    <text x="100" y="94" text-anchor="middle" font-size="12" fill="#742a2a">사람한테 물어봄</text>
  </g>
</svg>
