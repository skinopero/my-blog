<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="740" height="280" fill="#fbfbfb"/>
  <text x="370" y="24" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">무엇을 상속하느냐가 "체크 여부"를 결정한다</text>

  <rect x="290" y="40" width="160" height="36" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="1.5"/>
  <text x="370" y="63" font-size="12" text-anchor="middle" fill="#2d3748">Exception (최상위)</text>

  <path d="M330 76 V104" stroke="#188a5e" stroke-width="1.5" marker-end="url(#eh)"/>
  <path d="M410 76 V104" stroke="#dd6b20" stroke-width="1.5" marker-end="url(#eh2)"/>

  <rect x="120" y="106" width="200" height="40" rx="8" fill="#dff5e6" stroke="#188a5e" stroke-width="2"/>
  <text x="220" y="124" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#15513c">NegativeException</text>
  <text x="220" y="140" font-size="10" text-anchor="middle" fill="#15513c">extends Exception (체크 예외)</text>

  <rect x="420" y="106" width="240" height="40" rx="8" fill="#fff5f5" stroke="#dd6b20" stroke-width="2"/>
  <text x="540" y="124" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7b341e">ProductPriceNegativeException</text>
  <text x="540" y="140" font-size="10" text-anchor="middle" fill="#7b341e">extends RuntimeException (언체크)</text>

  <path d="M220 146 V174" stroke="#188a5e" stroke-width="1.5" marker-end="url(#eh)"/>
  <rect x="120" y="176" width="200" height="40" rx="8" fill="#dff5e6" stroke="#188a5e" stroke-width="2"/>
  <text x="220" y="200" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#15513c">MoneyNegativeException</text>

  <text x="220" y="240" font-size="11" fill="#15513c" text-anchor="middle">컴파일러가 "처리했어?"</text>
  <text x="220" y="256" font-size="11" fill="#15513c" text-anchor="middle">라고 강제로 물어본다</text>

  <text x="540" y="240" font-size="11" fill="#7b341e" text-anchor="middle">처리 안 해도 컴파일은 통과,</text>
  <text x="540" y="256" font-size="11" fill="#7b341e" text-anchor="middle">실행하다 만나면 그제서야 터진다</text>

  <defs>
    <marker id="eh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#188a5e"/></marker>
    <marker id="eh2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dd6b20"/></marker>
  </defs>
</svg>
